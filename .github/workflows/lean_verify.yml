name: Certification Formelle Lean 4 (v1.6.0)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-lean4:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4

      - name: Installation de Lean 4
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false

      - name: Génération et vérification Lean 4 pur (99,99991 %)
        run: |
          python3 scripts/generate_999999_lean.py
          lean theorems/UnifiedAlgebraicDuality.lean
          lean theorems/UltraHighCoverage.lean

      - name: Audit formel des axiomes (#print axioms)
        run: |
          cat << 'EOF' > /tmp/audit_axioms.lean
          import theorems.UnifiedAlgebraicDuality
          import theorems.UltraHighCoverage

          #print axioms erdosStrausUnifiedCoverage
          #print axioms collatzHighOrderDescent
          #print axioms UltraHighCoverage.erdosStrausPrimeDivCoverage
          EOF
          LEAN_PATH="." lean /tmp/audit_axioms.lean | tee /tmp/axioms_out.txt
          if grep -q "sorryAx" /tmp/axioms_out.txt; then
            echo "ERREUR : sorryAx détecté !"
            exit 1
          fi
          echo "SUCCÈS : Zéro sorryAx détecté."
